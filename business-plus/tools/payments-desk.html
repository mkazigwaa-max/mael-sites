:root{

  --line:#d0d2da; --line2:#ece8e9; --bg:#ece8e9; --card:#ece8e9; --black:#130606; --black2:#39291f;

  --info:#5c5f6b; --info-wash:#ece8e9; --hold:#5c5f6b; --hold-wash:#ece8e9;
  --dot:#d0d2da;
  --age0:#ece8e9; --age1:#b79d7a; --age2:#b79d7a; --age3:#a78464; --age4:#39291f;
  --r:12px; --r2:8px; --shadow:0 1px 2px rgba(16,18,22,.06),0 6px 20px rgba(16,18,22,.06);

}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
p,li,td,th,h1,h2,h3,.sub,figcaption,blockquote,.note{text-wrap:pretty}
.stat .sub,.share-row .sb,.item .why,.insight .s,.lead,.reason,.timeline .q,.msg p,.mode .s,.kv dd,.small.muted{text-wrap:balance}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:16px} h3{font-size:14px}
a{color:inherit}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.nowrap{white-space:nowrap}

.top{position:sticky;top:0;z-index:30;background:var(--black);color:#ece8e9;border-bottom:1px solid #222}

.top-right{flex:none}

.wordmark{font-weight:800;font-size:19px;letter-spacing:.14em;text-decoration:none;color:#ece8e9;white-space:nowrap;display:flex;align-items:center;gap:12px}
.wordmark .sep{width:1px;height:20px;background:#39291f}
.wordmark .app{font-weight:600;font-size:12px;letter-spacing:.02em;color:#bfb8b5;text-transform:none}
.tabs{display:flex;gap:2px;margin-left:8px;flex:none}
.tab{white-space:nowrap;position:relative;background:none;border:0;color:#bfb8b5;padding:0 10px;height:58px;cursor:pointer;font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;transition:color .15s}
.tab:hover{color:#ece8e9}
.tab[aria-current="page"]{color:#ece8e9}

.tab .badge{background:var(--bad);color:#ece8e9;border-radius:999px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.tab .badge.hold{background:var(--hold)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #39291f;border-radius:999px;padding:5px 11px;font-size:12px;color:#ece8e9;white-space:nowrap;background:transparent;cursor:default}
.pill.sample{border-style:dashed;color:#b79d7a;border-color:#635032}
.pill.btn{cursor:pointer;transition:background .15s,transform .08s}

.pill.btn.sim:hover{background:#ece8e9}

.item.picked{outline:2px solid var(--ink);outline-offset:2px}
.share{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line2);margin:4px 0 12px}
.share i{display:block;height:100%;min-width:2px;border-right:2px solid #ece8e9}
.share i:last-child{border-right:0}
.share-row{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2);text-decoration:none;color:inherit;font-size:13px}
.share-row:last-child{border-bottom:0}

table.rep th.r,table.rep td.r{width:14%}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 8px}
.rowhead.later{margin-top:20px}
.lead{font-size:13.5px;color:var(--ink2);margin:0 0 12px}
.lead-list{display:flex;flex-direction:column;gap:4px;margin:0 0 12px;font-size:13.5px;color:var(--ink2)}

.lead b{color:var(--ink)}

.menu{position:absolute;right:0;top:calc(100% + 8px);background:#ece8e9;color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow2);min-width:280px;padding:6px;z-index:40}

.rel{position:relative}

main{max-width:1280px;margin:0 auto;padding:22px 20px 120px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.g21{grid-template-columns:2fr 1fr} .g12{grid-template-columns:1fr 2fr}
@media(max-width:1000px){.g3,.g4,.g5{grid-template-columns:1fr 1fr}.g21,.g12{grid-template-columns:1fr}}
@media(max-width:640px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.card.tight{padding:12px 14px}
.card.link{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}

.card.link:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.card h2{margin-bottom:10px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}

.page-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;margin-bottom:10px;border:0;background:none;padding:0;cursor:pointer}
.back:hover{color:var(--ink)}
.back svg{width:14px;height:14px}
.section{margin-top:22px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}

.stat{display:flex;flex-direction:column;gap:4px;min-height:96px}

.stat .val{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .val.bad{color:var(--bad)} .stat .val.good{color:var(--good)} .stat .val.hold{color:var(--hold)} .stat .val.warn{color:var(--warn)}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;line-height:1.5}
.tag.good{background:var(--good-wash);color:var(--good)} .tag.bad{background:var(--bad-wash);color:var(--bad)} .tag.warn{background:var(--warn-wash);color:var(--warn)}
.tag.info{background:var(--info-wash);color:var(--info)} .tag.hold{background:var(--hold-wash);color:var(--hold)} .tag.gray{background:var(--line2);color:var(--ink2)}
.tag .i{font-size:10px}
.lg{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink2);background:#ece8e9}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:10px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer;transition:background .12s}
tr.click:hover{background:#ece8e9}
tr.click:active{background:#ece8e9}
td .name{font-weight:600;white-space:nowrap}
td.wrap .name,td.wrap .sub{white-space:normal;text-wrap:balance}
td.wrap .sub.nowrap{white-space:nowrap}
.head .sub{text-wrap:balance}
.item .meta a{white-space:nowrap}
td .sub{font-size:12px;color:var(--muted);white-space:nowrap}
.tot td{font-weight:700;border-top:2px solid var(--line);background:#ece8e9}
tr.prow td{background:#ece8e9;font-weight:700}
tr.prow:hover td{background:#ece8e9}
tr.prow td .sub{color:var(--ink2);font-weight:500}
.empty{padding:22px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#ece8e9;border-radius:var(--r2);padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;transition:background .12s,transform .08s,box-shadow .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:#ece8e9;border-color:#ece8e9}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.btn.primary{background:var(--black);color:#ece8e9;border-color:var(--black)}
.btn.primary:hover{background:#2f3c68}
.btn.good{background:var(--good);color:#ece8e9;border-color:var(--good)} .btn.good:hover{background:#5c5f6b}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.done{background:var(--good-wash);color:var(--good);border-color:transparent;pointer-events:none}
.btn .spin{width:12px;height:12px;border:2px solid rgba(236,232,233,.4);border-top-color:#ece8e9;border-radius:50%;animation:spin .7s linear infinite}
.btn.primary .spin{border-color:rgba(236,232,233,.35);border-top-color:#ece8e9}
.btn:not(.primary) .spin{border-color:rgba(0,0,0,.15);border-top-color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#ece8e9;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;color:var(--ink2)}
.chip:hover{border-color:#ece8e9}
.chip[aria-pressed="true"]{background:var(--black);color:#ece8e9;border-color:var(--black)}
.chip .n{opacity:.7;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.x-chip{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;cursor:pointer;padding:0 2px;border-radius:4px}
.x-chip:hover{color:var(--bad);background:var(--bad-wash)}
select,input[type=date],input[type=text],input[type=number]{font:inherit;border:1px solid var(--line);border-radius:var(--r2);padding:6px 9px;background:#ece8e9;color:var(--ink);font-size:13px}
input:focus-visible,select:focus-visible{outline:2px solid var(--info);outline-offset:1px}
.period{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.period .custom{display:flex;gap:6px;align-items:center}

.work{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:auto 1fr 236px;gap:16px;align-items:start;transition:transform .15s,box-shadow .15s,opacity .3s}
.item:hover{box-shadow:var(--shadow2)}

.item .ic.bad{background:var(--bad-wash);color:var(--bad)} .item .ic.hold{background:var(--hold-wash);color:var(--hold)} .item .ic.warn{background:var(--warn-wash);color:var(--warn)} .item .ic.info{background:var(--info-wash);color:var(--info)} .item .ic.good{background:var(--good-wash);color:var(--good)}

.item .meta a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}

.item .side{text-align:right;display:flex;flex-direction:column;gap:10px;align-items:stretch;border-left:1px solid var(--line2);padding-left:16px;min-height:100%}

.item .ev .evt{font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;font-size:10px;margin-bottom:3px}

@media(max-width:700px){.item{grid-template-columns:auto 1fr}.item .side{grid-column:1/-1;border-left:0;padding-left:0}}

.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:150px 1fr 96px;gap:10px;align-items:center;font-size:12.5px}
.bar .k{color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t{height:16px;background:var(--line2);border-radius:4px;overflow:hidden;position:relative}

.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;align-items:end;height:190px}
.col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}

@media(max-width:700px){.cols{grid-template-columns:repeat(6,1fr)}.col:nth-child(-n+6){display:none}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}

.tree .parent{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.acct-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

.timeline .k.out{background:var(--info-wash);color:var(--info)} .timeline .k.in{background:var(--good-wash);color:var(--good)} .timeline .k.sys{background:var(--line2);color:var(--ink2)} .timeline .k.bad{background:var(--bad-wash);color:var(--bad)} .timeline .k.hold{background:var(--hold-wash);color:var(--hold)}
.timeline .b{color:var(--ink2);min-width:0} .timeline .b b{color:var(--ink)}

.pname{font-weight:600;text-wrap:balance}
.insight .t{text-wrap:balance}
th{text-wrap:balance}
.card ul li{text-wrap:balance}
.timeline .b b{white-space:nowrap}
.timeline .b .iv{white-space:nowrap;color:var(--muted);font-weight:600}
.item .ttl{text-wrap:balance}
.line-img{width:34px;height:34px;border-radius:6px;object-fit:cover;background:var(--line2);flex:none}

PRODUCTS.forEach(p => { p.wh = Math.round(p.retail/2/100)*100 + (p.retail%200===199?50:0); p.wh = Math.round(p.retail*0.5); });
const PMAP = Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));
const AMAP = Object.fromEntries(ACCOUNTS.map(a=>[a.id,a]));
const PARMAP = Object.fromEntries(PARENTS.map(p=>[p.id,p]));
const DEFAULT_CADENCE = { first:3, second:10, third:20, escalate:30 };
function cadenceSteps(c){ return [c.first, c.second, c.third, c.escalate]; }

/* ---------- build the invoices, historic payments and messages ---------- */
function buildWorld(){
  const r = rng(500);
  const invoices = [], bank = [], seq = { n: 10412 };
  const stories = STORY_PLAN();

  ACCOUNTS.forEach(a => {
    const parent = PARMAP[a.parent];
    const start = -160 + Math.floor(r()*a.every);
    for (let t = start; t <= 0; t += a.every) {
      const nLines = a.channel.indexOf('Dropship')===0 ? 3 + Math.floor(r()*3) : 2 + Math.floor(r()*3);
      const pool = PRODUCTS.filter(p => a.leagues.indexOf(p.lg) !== -1);
      const lines = [], used = {};
      for (let i=0;i<nLines;i++){ let p = pool[Math.floor(r()*pool.length)]; let g=0; while(used[p.id] && g++<8) p = pool[Math.floor(r()*pool.length)]; used[p.id]=1;
        const qty = a.channel.indexOf('Dropship')===0 ? 6 + Math.floor(r()*40) : 24 * (1+Math.floor(r()*8));
        lines.push({ pid:p.id, lg:p.lg, qty, unit:p.wh, cents: qty*p.wh }); }
      // scale total into the account's typical size band
      let total = sum(lines, l=>l.cents); const want = a.size[0] + r()*(a.size[1]-a.size[0]); const k = want/total;
      lines.forEach(l => { l.qty = Math.max(1, Math.round(l.qty*k)); l.cents = l.qty*l.unit; }); total = sum(lines, l=>l.cents);
      const late = (a.late.since!=null && t >= a.late.since) ? a.late.recentMean : a.late.mean;
      const lateDays = Math.round(gauss(r, late, a.late.sd));
      const inv = { id:'INV-'+(seq.n++), acct:a.id, parent:a.parent, issue:iso(D(t)), due:iso(D(t+a.terms)), terms:a.terms, lines, total, lateDays,
        po: (a.channel.indexOf('Dropship')===0 ? 'EDI batch ' : 'PO ') + (48000 + Math.floor(r()*9000)), applied:[], credits:[], msgs:[], flags:{} };
      invoices.push(inv);
    }
  });
  invoices.sort((x,y)=> x.issue<y.issue?-1:1);
  // reassign ids in date order so numbers read naturally
  let n = 10412; invoices.forEach(i => { i.id = 'INV-'+(n++); });

  // stories claim their invoices before anything is settled
  stories.forEach(s => s.claim(invoices));

  // settle: everything the world says was paid before the file was opened
  const groups = {};
  invoices.forEach(inv => {
    if (inv.story) return;
    const a = AMAP[inv.acct]; const payDay = rel(inv.due) + inv.lateDays;
    if (payDay > -1) return;                                  // still open
    let deduct = 0, code = null;
    if (a.deduct && r() < a.deduct) { deduct = Math.round(inv.total * (0.01 + r()*0.02) / 100) * 100; code = r()<0.5 ? 'CB-HT · hang tags missing' : 'CB-ASN · late ship notice'; }
    if (a.batch) { const wk = Math.floor(payDay/7); const key = a.parent+'|'+wk; (groups[key] = groups[key] || { acct:a, day: wk*7+3, items:[] }).items.push({inv, deduct, code}); }
    else { addBank(bank, seq, { day:payDay, method:a.method, parent:a.parent, items:[{inv, deduct, code}] }); }
    // reminders that went out before the money arrived
    cadenceSteps(DEFAULT_CADENCE).forEach((step, k) => { const d = rel(inv.due)+step; if (d < payDay && d <= 0) inv.msgs.push(msg(d, 'out', k===3?'escalation':'reminder', reminderText(inv, k), true)); });
  });
  Object.values(groups).forEach(g => addBank(bank, seq, { day:g.day, method:'ACH', parent:g.acct.parent, items:g.items }));

  // now let the stories place their own payments, messages and holds
  stories.forEach(s => s.settle(invoices, bank, seq));

  // reminders on plain overdue invoices, sent automatically up to the day the file opened
  invoices.forEach(inv => {
    if (inv.story || balance(inv) <= 0) return;
    cadenceSteps(DEFAULT_CADENCE).forEach((step, k) => { const d = rel(inv.due)+step; if (d <= -1) inv.msgs.push(msg(d, 'out', k===3?'escalation':'reminder', reminderText(inv, k), true)); });
  });
  bank.sort((x,y)=> x.date<y.date?-1:1);
  return { invoices, bank, seq };
}
function msg(day, dir, kind, text, auto){ return { date: iso(D(day)), dir, kind, text, auto: !!auto }; }
function addBank(bank, seq, o){
  const parent = PARMAP[o.parent];
  const amount = sum(o.items, x => x.inv.total - x.deduct);
  const b = { id:'BK-'+(seq.n++), date: iso(D(o.day)), method:o.method, amount, payer:parent.payer, parent:o.parent, memo: o.memo || (o.method==='Check' ? 'Check #'+(4000+Math.floor(amount%997)) : o.method==='Wire' ? 'Wire ref '+(700100+Math.floor(amount%811)) : 'ACH '+o.items.map(x=>x.inv.id.replace('INV-','')).join(' ')), applied:[], status:'matched', auto:true };
  o.items.forEach(x => { b.applied.push({ inv:x.inv.id, cents:x.inv.total - x.deduct }); x.inv.applied.push({ bank:b.id, cents:x.inv.total - x.deduct, date:b.date });

function balance(inv){ return inv.total - sum(inv.applied, a=>a.cents) - sum(inv.credits, c=>c.cents); }
function reminderText(inv, k){

/* =====================================================================
   THE STORIES — the situations the demo exists to show. Each one claims
   an invoice near a chosen due date, then writes its own payment,
   messages or holds. Everything else in the world is ordinary.
   ===================================================================== */
function nearest(invoices, acct, dueDay, taken){
  let best = null, bd = 1e9;
  invoices.forEach(i => { if (i.acct!==acct || i.story || (taken && taken[i.id])) return; const d = Math.abs(rel(i.due)-dueDay); if (d<bd){bd=d;best=i;} });
  if (best) { best.issue = iso(D(dueDay - best.terms)); best.due = iso(D(dueDay)); }
  return best;
}

/* =====================================================================
   STATE — what the person did in this browser. Saved between visits.
   The world above is rebuilt from scratch every load; these events are
   replayed on top of it, so the numbers are never stored, only derived.
   ===================================================================== */
const STORE_KEY = 'northline-payments-desk-v1';
const DEFAULT_STATE = () => ({ offset:0, mode:'auto', cadence:Object.assign({},DEFAULT_CADENCE), acct:{}, events:[], seq:1, period:'30d', from:'', to:'', sim:{bank:0,inbox:0}, asked:[], train:{ rules:[], samples:[], signoff:'' } });
let STATE = loadState();
function loadState(){ try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.events) { const st = Object.assign(DEFAULT_STATE(), s); if (!st.train) st.train = { rules:[], samples:[], signoff:'' }; return st; } } catch(e){} return DEFAULT_STATE(); }
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); } catch(e){} }
function todayN(){ return STATE.offset; }
function todayISO(){ return iso(D(STATE.offset)); }
function addEvent(type, p){ const e = Object.assign({ id:'E'+(STATE.seq++), type, day: todayN(), date: todayISO() }, p||{}); STATE.events.push(e); saveState(); rebuild(); return e; }

/* =====================================================================
   DERIVE — replay the events on the fresh world and work out the view.
   Every screen, badge, total and Ask answer reads from M, and only M.
   ===================================================================== */
let W = null, M = null;
function rebuild(){
  W = buildWorld();
  const inv = {}; W.invoices.forEach(i => { inv[i.id] = i; });
  M = { invoices: W.invoices, inv, bank: W.bank.slice(), seq: W.seq, pending: [], acct: {}, log: [], settings: { mode: 'auto', cadence: Object.assign({}, DEFAULT_CADENCE) }, sim: { bank: 0, inbox: 0 } };
  ACCOUNTS.forEach(a => { M.acct[a.id] = { paused:false, approval:false, note:'' }; });
  // the day the file opened, the world's own automation had already run through yesterday
  STATE.events.forEach(e => replay(e));
  // reminders due on days nobody pressed Run are sent by the scheduled job in auto mode
  computeHolds(todayN());
  M.work = buildWork();
  M.today = todayN();
}
function replay(e){
  const t = e.day;
  switch (e.type) {
    case 'settings': if (e.mode) M.settings.mode = e.mode; if (e.cadence) M.settings.cadence = Object.assign({}, e.cadence); break;
    case 'acct': Object.assign(M.acct[e.acct], e.set); if (e.set.paused===false || e.set.approval===false) M.log.push(logRow(t,'sys', AMAP[e.acct].name+': follow-ups resumed', e.acct)); if (e.set.paused===true) M.log.push(logRow(t,'sys', AMAP[e.acct].name+': follow-ups paused', e.acct)); break;
    case 'apply': { const b = M.bank.find(x=>x.id===e.bank); if (!b) break; b.status='matched'; b.applied = e.splits.slice(); b.auto = false;
      e.splits.forEach(s => { const i = M.inv[s.inv]; i.applied.push({ bank:b.id, cents:s.cents, date:b.date }); i.msgs.push(msg(t,'sys','match', b.method+' '+money(s.cents)+' applied by hand from '+b.id+'.')); });
      if (e.credit) { const i = M.inv[e.credit.inv]; i.credits.push({ cents:e.credit.cents, reason:e.credit.reason, date:e.date, kind:'deduction' }); i.msgs.push(msg(t,'sys','credit','Deduction of '+money(e.credit.cents)+' accepted: '+e.credit.reason)); }
      if (e.ask) { const i = M.inv[e.ask.inv]; i.flags.shortAsked = { date:e.date, cents:e.ask.cents }; i.msgs.push(msg(t,'out','message','We applied your '+b.method+' of '+money(b.amount)+'. It came in '+money(e.ask.cents)+' short of '+e.ask.list.join(', ')+'. Could you send the remittance detail so we can tie it out?')); }
      M.log.push(logRow(t,'in', b.method+' '+money(b.amount)+' from '+PARMAP[b.parent].name+' matched to '+e.splits.length+' invoice'+(e.splits.length>1?'s':''), null, b.parent)); break; }
    case 'credit': { const i = M.inv[e.inv]; i.credits.push({ cents:e.cents, reason:e.reason, date:e.date, kind:e.kind||'credit' }); i.msgs.push(msg(t,'sys','credit','Credit of '+money(e.cents)+': '+e.reason)); if (i.dispute) i.dispute.status='accepted'; i.flags.smallBalanceDone = true; i.flags.partialReviewed = true;
      M.log.push(logRow(t,'sys','Credit '+money(e.cents)+' on '+i.id+' ('+e.reason+')', i.acct)); break; }
    case 'send': { const i = M.inv[e.inv]; i.msgs.push(msg(t, 'out', e.kind, e.text, !!e.auto)); if (e.kind==='escalation') i.flags.escalated = e.date; if (e.kind==='check-trace') i.flags.checkTraced = e.date; if (e.kind==='dispute-push' && i.dispute) { i.dispute.status='pushed'; i.dispute.pushed=e.date; } if (e.kind==='remainder') i.flags.partialReviewed = true; if (e.kind==='remit-ask') i.flags.remitAsked = e.date;
      M.log.push(logRow(t, 'out', (e.auto?'Auto: ':'')+kindLabel(e.kind)+' sent for '+i.id, i.acct)); break; }
    case 'promise': { const i = M.inv[e.inv]; i.promise = { date:e.pdate, note:e.note||'Recorded by hand', made:e.date }; i.msgs.push(msg(t,'sys','promise','Promise to pay recorded for '+fmtD(e.pdate)+'.')); M.log.push(logRow(t,'sys','Promise recorded on '+i.id+' for '+fmtD(e.pdate), i.acct)); break; }
    case 'check-received': { const i = M.inv[e.inv]; const b = { id:'BK-'+(M.seq.n++), date:e.date, method:'Check', amount:e.cents, payer:PARMAP[i.parent].payer, parent:i.parent, memo:'Check #'+(i.flags.checkReported?i.flags.checkReported.number:'—'), applied:[{inv:i.id,cents:e.cents}], status:'matched', auto:false }; M.bank.push(b); i.applied.push({bank:b.id,cents:e.cents,date:e.date}); i.msgs.push(msg(t,'sys','match','Check received and applied: '+money(e.cents)+'.')); M.log.push(logRow(t,'in','Check '+money(e.cents)+' from '+PARMAP[i.parent].name+' received and applied to '+i.id, i.acct)); break; }
    case 'approve': { const p = M.pending.find(x=>x.id===e.pid); if (!p) break; M.pending = M.pending.filter(x=>x!==p); const i = M.inv[p.inv]; i.msgs.push(msg(t,'out',p.kind,p.text,false)); M.log.push(logRow(t,'out',kindLabel(p.kind)+' approved and sent for '+i.id, i.acct)); break; }
    case 'skip': { const p = M.pending.find(x=>x.id===e.pid); if (!p) break; M.pending = M.pending.filter(x=>x!==p); const i = M.inv[p.inv]; i.flags.skipUntil = e.until; i.msgs.push(msg(t,'sys','skip','Reminder skipped until '+fmtD(e.until)+'.')); M.log.push(logRow(t,'sys','Reminder on '+i.id+' skipped until '+fmtD(e.until), i.acct)); break; }
    case 'run': runAutomation(t, false); break;
    case 'jump': for (let d = e.from+1; d <= e.to; d++) runAutomation(d, true); M.log.push(logRow(e.to,'sys','Moved the demo clock forward '+(e.to-e.from)+' days')); break;

}
function logRow(day, kind, text, acct, parent){ return { date: iso(D(day)), day, kind, text, acct: acct||null, parent: parent || (acct ? AMAP[acct].parent : null) }; }
function kindLabel(k){ return { reminder:'Reminder', escalation:'Escalation', message:'Message', 'check-trace':'Check trace request', 'dispute-push':'Dispute reply', remainder:'Reminder for the remainder', 'remit-ask':'Remittance request', draft:'Follow-up' }[k] || 'Message'; }

/* ---------- what the automation would do on a given day ---------- */
function invState(inv, t){
  const bal = balance(inv); const dueN = rel(inv.due); const daysLate = t - dueN;
  const reminders = inv.msgs.filter(m => m.dir==='out' && (m.kind==='reminder'||m.kind==='escalation'||m.kind==='remainder') && rel(m.date) <= t);
  const replies = inv.msgs.filter(m => m.dir==='in' && rel(m.date) <= t);
  const lastOut = reminders.length ? reminders[reminders.length-1] : null;
  const lastContact = inv.msgs.filter(m => (m.dir==='out'||m.dir==='in') && rel(m.date) <= t).slice(-1)[0] || null;
  return { bal, dueN, daysLate, reminders, replies, lastOut, lastContact, sent: reminders.length };
}
/* Every reason a reminder would NOT go out today. The first reason is the one shown. */
function holdsFor(inv, t){
  const h = []; const a = M.acct[inv.acct]; const st = invState(inv, t);
  if (st.bal <= 0) return h;
  if (a.paused) h.push({ code:'paused', text:'Account follow-ups are paused', kind:'hold' });
  if (inv.dispute && inv.dispute.status !== 'accepted') h.push({ code:'dispute', text:'A chargeback is open on this invoice', kind:'bad' });
  if (inv.promise && rel(inv.promise.date) >= t) h.push({ code:'promise', text:'Payment promised for '+fmtD(inv.promise.date), kind:'info' });
  if (inv.flags.saysPaid && !inv.flags.saysPaidResolved) h.push({ code:'says-paid', text:'Customer says it was paid. Check the bank before chasing', kind:'hold' });
  if (inv.flags.checkReported && !inv.flags.checkTraced) { if (rel(inv.flags.checkReported.expected) >= t) h.push({ code:'check-wait', text:'Check #'+inv.flags.checkReported.number+' reported mailed, expected by '+fmtD(inv.flags.checkReported.expected), kind:'info' }); else h.push({ code:'check-late', text:'Check #'+inv.flags.checkReported.number+' was reported mailed and has not arrived', kind:'hold' }); }
  const cand = M.bank.filter(b => b.parent===inv.parent && b.status!=='matched' && rel(b.date) <= t);
  if (cand.length) h.push({ code:'possible-payment', text:'A '+cand[0].method+' from '+PARMAP[inv.parent].name+' for '+money(cand[0].amount)+' is waiting to be matched', kind:'hold', bank:cand[0].id });
  if (inv.flags.partial && !inv.flags.partialReviewed) h.push({ code:'partial', text:'Part paid. Decide whether to chase the rest or accept a deduction', kind:'hold' });
  if (inv.flags.skipUntil && rel(inv.flags.skipUntil) >= t) h.push({ code:'skipped', text:'Skipped until '+fmtD(inv.flags.skipUntil), kind:'info' });
  if (inv.flags.shortAsked && !inv.flags.shortResolved) h.push({ code:'short', text:'Asked AP for remittance detail on a short payment', kind:'info' });
  if (st.sent >= 4 || (inv.flags.escalated)) h.push({ code:'exhausted', text:'Escalated. Needs a person, not another reminder', kind:'bad' });
  return h;
}
/* Which reminder step is next, or null if none is due today. */
function nextStep(inv, t){
  const st = invState(inv, t); if (st.bal <= 0 || st.daysLate < 0) return null;
  const steps = cadenceSteps(M.settings.cadence);
  const k = st.sent; if (k >= steps.length) return null;
  const dueDay = st.dueN + steps[k];
  if (st.lastOut && rel(st.lastOut.date) >= t) return null;
  return { k, day: dueDay, kind: k===3?'escalation':'reminder', due: dueDay <= t };
}
function computeHolds(t){
  M.invoices.forEach(inv => { inv.holds = holdsFor(inv, t); inv.next = nextStep(inv, t); inv.st = invState(inv, t); });
}
function runAutomation(t, scheduled){
  computeHolds(t);
  let sent = 0, queued = 0, held = 0;
  M.invoices.forEach(inv => {
    if (inv.st.bal <= 0 || !inv.next || !inv.next.due) return;
    if (inv.holds.length) { held++; return; }
    if (M.pending.find(p => p.inv===inv.id)) return;
    const text = reminderText(inv, inv.next.k);
    const needsOk = M.settings.mode==='approval' || M.acct[inv.acct].approval;
    if (needsOk) { M.pending.push({ id:'P'+inv.id+'-'+inv.next.k, inv:inv.id, kind:inv.next.kind, k:inv.next.k, text, date: iso(D(t)) }); queued++; }
    else { inv.msgs.push(msg(t, 'out', inv.next.kind, text, true)); sent++; }
  });
  M.log.push(logRow(t,'sys',(scheduled?'Scheduled run: ':'Run now: ')+plural(sent,'reminder')+' sent, '+queued+' waiting for approval, '+held+' held'));
  M.lastRun = { day:t, sent, queued, held };
  computeHolds(t);
}

/* ---------- the scripted bank feed and inbox pulls ---------- */
function simBank(n, t){
  M.sim.bank = n;
  if (n === 1) {
    const sp = M.invoices.find(i => i.story==='says-paid');
    if (sp && balance(sp) > 0) { const b = { id:'BK-'+(M.seq.n++), date: iso(D(Math.min(t, rel(sp.flags.saysPaid.claimedDate)+1))), method:'ACH', amount: sp.total, payer:'FANWEAR DIRECT LLC', parent:'fanwear', memo:'ACH REMIT '+sp.id.replace('INV-',''), applied:[{inv:sp.id,cents:sp.total}], status:'matched', auto:true, fresh:t }; M.bank.push(b); sp.applied.push({bank:b.id,cents:sp.total,date:b.date}); sp.flags.saysPaidResolved = true; sp.msgs.push(msg(t,'sys','match','Bank feed: ACH '+money(sp.total)+' found and applied. The customer was right.',true)); M.log.push(logRow(t,'in','Bank feed: ACH '+money(sp.total)+' from Fanwear Direct matched to '+sp.id+' automatically', sp.acct)); }
    const de = M.invoices.filter(i => i.acct==='th-ecom' && balance(i)>0 && rel(i.due) <= t+3).slice(0,2);

    if (inv.flags.partial && !inv.flags.partialReviewed) push({ id:'W-P-'+inv.id, kind:'partial', sev:2, ic:'hold', icon:'½', inv:inv.id, acct:inv.acct, parent:inv.parent, amount:bal, title:'Part payment on '+inv.id+', '+money(bal)+' still open', why:PARMAP[inv.parent].name+' paid '+money(inv.total-bal)+' of '+money(inv.total)+' by check with no note. Chase the rest, or accept it as a deduction.', owner:'Accounting' });
    if (inv.flags.checkReported && !inv.flags.checkTraced && rel(inv.flags.checkReported.expected) < t) push({ id:'W-C-'+inv.id, kind:'check', sev:2, ic:'hold', icon:'✉', inv:inv.id, acct:inv.acct, parent:inv.parent, amount:bal, title:'Check #'+inv.flags.checkReported.number+' from '+PARMAP[inv.parent].name+' has not arrived', why:'Reported mailed '+fmtD(inv.flags.checkReported.date)+', expected by '+fmtD(inv.flags.checkReported.expected)+'. Nothing in the bank or the mail. Reminders were held while we waited.', owner:'Accounting' });
    if (inv.promise && rel(inv.promise.date) < t && !inv.flags.promiseHandled) push({ id:'W-PR-'+inv.id, kind:'promise', sev:1, ic:'bad', icon:'✕', inv:inv.id, acct:inv.acct, parent:inv.parent, amount:bal, title:PARMAP[inv.parent].name+' missed a promised payment on '+inv.id, why:'Promised for '+fmtD(inv.promise.date)+' ('+inv.promise.note+'), '+(t-rel(inv.promise.date))+' days ago. '+st.daysLate+' days past terms.', owner:REPS[a.rep] });
    if (inv.flags.saysPaid && !inv.flags.saysPaidResolved) push({ id:'W-S-'+inv.id, kind:'says-paid', sev:2, ic:'hold', icon:'?', inv:inv.id, acct:inv.acct, parent:inv.parent, amount:bal, title:PARMAP[inv.parent].name+' says '+inv.id+' was paid on '+fmtD(inv.flags.saysPaid.claimedDate), why:'No ACH for '+money(bal)+' in the bank feed yet. Reminders are held. Check the bank, then either close it or ask for the remittance.', owner:'Accounting' });
    if (inv.flags.noReply && !inv.flags.escalated && !inv.flags.paperwork) push({ id:'W-N-'+inv.id, kind:'no-reply', sev:1, ic:'bad', icon:'3', inv:inv.id, acct:inv.acct, parent:inv.parent, amount:bal, title:'No reply after three reminders on '+inv.id, why:st.daysLate+' days past terms, last reminder '+fmtD(st.lastOut.date)+'. Time for a person to reach the buyer, not a fourth email.', owner:REPS[a.rep] });
    if (inv.flags.paperwork && !inv.flags.resent) push({ id:'W-PW-'+inv.id, kind:'paperwork', sev:2, ic:'info', icon:'⇄', inv:inv.id, acct:inv.acct, parent:inv.parent, amount:bal, title:inv.id+' never reached the Fanwear Direct portal', why:'AP replied that the EDI invoice was not received, so it was never scheduled. Resend it and the next weekly remit should carry it.', owner:'Accounting' });
    if (inv.flags.smallBalance && !inv.flags.smallBalanceDone) push({ id:'W-SB-'+inv.id, kind:'small', sev:3, ic:'info', icon:'¢', inv:inv.id, acct:inv.acct, parent:inv.parent, amount:bal, title:money(bal)+' left on '+inv.id+' after a deduction', why:PARMAP[inv.parent].name+' deducted '+money(bal)+' ("'+inv.flags.smallBalance.code+'"). Too small to chase; close it so no reminder goes out for '+money(bal)+'.', owner:'Accounting' });
  });

  items.sort((x,y)=> x.sev-y.sev || y.amount-x.amount);
  // what the automation is doing on its own
  const auto = M.invoices.filter(inv => balance(inv) > 0 && inv.st.daysLate >= 0 && !inv.holds.length && !M.pending.find(p=>p.inv===inv.id) && !items.find(w => w.inv===inv.id || (w.invs||[]).indexOf(inv.id)!==-1))
    .map(inv => ({ inv, next: inv.next })).sort((x,y)=> (x.next?x.next.day:1e9) - (y.next?y.next.day:1e9));

/* =====================================================================
   METRICS — every number on every screen comes out of here.
   ===================================================================== */
function periodRange(){
  const t = todayN(); const p = STATE.period;
  if (p==='custom' && STATE.from && STATE.to) return { from: STATE.from, to: STATE.to, label: fmtD(STATE.from)+' – '+fmtD(STATE.to) };
  if (p==='month') { const d = D(t); return { from: iso(new Date(d.getFullYear(), d.getMonth(), 1)), to: todayISO(), label:'This month' }; }
  if (p==='qtd') { const d = D(t); const q = Math.floor(d.getMonth()/3)*3; return { from: iso(new Date(d.getFullYear(), q, 1)), to: todayISO(), label:'Quarter to date' }; }
  if (p==='ytd') { const d = D(t); return { from: iso(new Date(d.getFullYear(), 0, 1)), to: todayISO(), label:'Year to date' }; }
  if (p==='90d') return { from: iso(D(t-89)), to: todayISO(), label:'Last 90 days' };
  return { from: iso(D(t-29)), to: todayISO(), label:'Last 30 days' };
}
function inRange(d, r){ return d >= r.from && d <= r.to; }
function ageBucket(daysLate){ return daysLate < 1 ? 0 : daysLate <= 30 ? 1 : daysLate <= 60 ? 2 : daysLate <= 90 ? 3 : 4; }
const AGE_LABELS = ['Not yet due','1–30 days','31–60 days','61–90 days','Over 90 days'];
function metrics(filter){
  const t = todayN(); const r = periodRange();
  const invs = M.invoices.filter(i => !filter || filter(i));
  const open = invs.filter(i => balance(i) > 0);
  const overdue = open.filter(i => i.st.daysLate > 0);
  const aging = [0,0,0,0,0]; open.forEach(i => { aging[ageBucket(i.st.daysLate)] += balance(i); });
  const held = open.filter(i => i.holds.length && i.st.daysLate > 0);
  // history in the period
  let collected = 0, nPaid = 0, onTime = 0, lateSum = 0, lateN = 0, issued = 0, nIssued = 0;
  invs.forEach(i => {
    if (inRange(i.issue, r)) { issued += i.total; nIssued++; }
    i.applied.forEach(a => { if (inRange(a.date, r)) collected += a.cents; });
    if (balance(i) <= 0 && i.applied.length) { const last = i.applied.map(a=>a.date).sort().slice(-1)[0]; if (inRange(last, r)) { nPaid++; const dl = rel(last) - rel(i.due); if (dl <= 0) onTime++; lateSum += Math.max(0, dl); lateN++; } }
  });
  const credits = sum(invs, i => sum(i.credits.filter(c => inRange(c.date, r)), c=>c.cents));
  return { r, open, overdue, held, aging, outstanding: sum(open, balance), overdueAmt: sum(overdue, balance), heldAmt: sum(held, balance),
    collected, nPaid, onTimeRate: nPaid ? onTime/nPaid : null, avgLate: lateN ? lateSum/lateN : null, issued, nIssued, credits, invs };
}
/* Payment habits for one account or parent, over a window of days ending today. */
function habits(invs, fromDay, toDay){
  const paid = invs.filter(i => balance(i) <= 0 && i.applied.length).map(i => ({ i, last: i.applied.map(a=>a.date).sort().slice(-1)[0] })).filter(x => rel(x.last) > fromDay && rel(x.last) <= toDay);
  const n = paid.length; if (!n) return { n:0, onTime:null, avgLate:null, avgDays:null };
  const lates = paid.map(x => rel(x.last) - rel(x.i.due));
  return { n, onTime: lates.filter(l=>l<=0).length/n, avgLate: sum(lates.map(l=>Math.max(0,l)))/n, avgDays: sum(paid.map(x => rel(x.last)-rel(x.i.issue)))/n, maxLate: Math.max.apply(null, lates) };
}
function acctStats(id){
  const invs = M.invoices.filter(i => i.acct===id); const t = todayN();
  const open = invs.filter(i => balance(i)>0), overdue = open.filter(i => i.st.daysLate>0);
  const recent = habits(invs, t-60, t), prior = habits(invs, t-150, t-60), all = habits(invs, t-400, t);
  let trend = 'flat'; if (recent.n && prior.n && recent.avgLate!=null && prior.avgLate!=null) { if (recent.avgLate - prior.avgLate >= 5) trend='worse'; else if (prior.avgLate - recent.avgLate >= 5) trend='better'; }
  const promisesMissed = invs.filter(i => i.promise && rel(i.promise.date) < t && balance(i)>0).length;
  const noReply = invs.filter(i => i.flags.noReply && balance(i)>0).length;
  const exceptions = M.work.items.filter(w => w.acct===id).length;
  return { id, a:AMAP[id], invs, open, overdue, openAmt:sum(open,balance), overdueAmt:sum(overdue,balance), recent, prior, all, trend, promisesMissed, noReply, exceptions, maxLate: overdue.length ? Math.max.apply(null, overdue.map(i=>i.st.daysLate)) : 0 };
}
function parentStats(pid){
  const accts = ACCOUNTS.filter(a=>a.parent===pid).map(a=>acctStats(a.id)); const t = todayN();
  const invs = M.invoices.filter(i=>i.parent===pid); const open = invs.filter(i=>balance(i)>0), overdue = open.filter(i=>i.st.daysLate>0);
  const worst = accts.slice().sort((x,y)=> y.overdueAmt-x.overdueAmt)[0];
  return { id:pid, p:PARMAP[pid], accts, invs, open, overdue, openAmt:sum(open,balance), overdueAmt:sum(overdue,balance), recent:habits(invs,t-60,t), prior:habits(invs,t-150,t-60), all:habits(invs,t-400,t), worst, exceptions: M.work.items.filter(w=>w.parent===pid).length };
}
function repStats(){
  return Object.keys(REPS).map(k => { const accts = ACCOUNTS.filter(a=>a.rep===k).map(a=>acctStats(a.id)); return { rep:k, name:REPS[k], accts, overdueAmt:sum(accts,s=>s.overdueAmt), overdueN:sum(accts,s=>s.overdue.length), openAmt:sum(accts,s=>s.openAmt), exceptions:sum(accts,s=>s.exceptions), late: accts.filter(s=>s.overdue.length).length }; }).sort((x,y)=>y.overdueAmt-x.overdueAmt);
}
/* Why an invoice is overdue, in one label. Facts only: what the records show. */
function reasonFor(inv){
  if (balance(inv) <= 0) return null;
  if (inv.dispute && inv.dispute.status!=='accepted') return { code:'dispute', text:'Disputed deduction' };
  if (inv.flags.paperwork) return { code:'paperwork', text:'Invoice never received' };
  if (inv.promise && rel(inv.promise.date) < todayN()) return { code:'promise', text:'Promise missed' };
  if (inv.promise) return { code:'promised', text:'Payment promised' };
  if (inv.flags.saysPaid && !inv.flags.saysPaidResolved) return { code:'unmatched', text:'Says paid, not matched' };
  if (inv.flags.checkReported && !inv.flags.checkTraced) return { code:'check', text:'Check in the mail' };
  if (inv.flags.partial && !inv.flags.partialReviewed) return { code:'partial', text:'Part paid' };
  if (inv.holds.find(h=>h.code==='possible-payment')) return { code:'unmatched', text:'Payment may have arrived' };
  if (inv.flags.noReply || inv.st.sent >= 3) return { code:'silent', text:'No reply to reminders' };
  if (inv.st.daysLate > 0) return { code:'slow', text:'Slow payment' };
  return null;
}

/* =====================================================================
   ROUTER — hash addresses, real browser history, scroll put back.
   ===================================================================== */
const TABS = [ ['overview','Overview'], ['work','Follow-ups'], ['accounts','Accounts'], ['insights','Insights'], ['automation','Automation'], ['train','Train'] ];
let histIdx = 0; const scrolls = {};
function parseHash(){ const decodeURIComponent = (s) => { try { return window.decodeURIComponent(s); } catch (e) { return s; } }; const h = (location.hash || '#/overview').replace(/^#\/?/, ''); const [path, qs] = h.split('?'); const parts = path.split('/').filter(Boolean); const q = {}; (qs||'').split('&').forEach(kv => { if (!kv) return; const [k,v] = kv.split('='); q[decodeURIComponent(k)] = decodeURIComponent(v||''); }); return { parts, q, tab: parts[0]||'overview' }; }
function go(hash){ if (!hash.startsWith('#')) hash = '#'+hash; const before = parseHash().parts.join('/'); scrolls[histIdx] = window.scrollY; histIdx++; history.pushState({ i: histIdx }, '', hash); const same = parseHash().parts.join('/') === before; if (same) { const y = window.scrollY; render(false); window.scrollTo(0, y); } else { render(true); window.scrollTo(0,0); } }
window.addEventListener('popstate', e => { scrolls[histIdx] = window.scrollY; histIdx = (e.state && e.state.i) || 0; render(false); const y = scrolls[histIdx] || 0; requestAnimationFrame(()=>window.scrollTo(0,y)); });
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]'); if (a && !e.metaKey && !e.ctrlKey) { e.preventDefault(); go(a.getAttribute('href')); return; }
  const r = e.target.closest('[data-go]'); if (r && !e.target.closest('button,a,input,select,label')) { go(r.getAttribute('data-go')); }
});
function hashFor(o){ return '#/'+o.path+(o.q ? '?'+Object.keys(o.q).filter(k=>o.q[k]!=null&&o.q[k]!=='').map(k=>encodeURIComponent(k)+'='+encodeURIComponent(o.q[k])).join('&') : ''); }
function invHash(id){ return '#/invoices/'+id; }
function acctHash(id){ const a = AMAP[id]; return '#/accounts/'+a.parent+'/'+id; }
function parentHash(id){ return '#/accounts/'+id; }
function workHash(f, extra){ return hashFor({ path:'work', q: Object.assign({ f }, extra||{}) }); }

function statusTag(inv){

function deltaText(now, prev, unit, lowerIsBetter){
  if (now==null || prev==null) return 'no prior period';
  let d = now - prev; if (unit==='pts') d = d*100;

  const txt = unit==='money' ? money0(abs) : unit==='pts' ? (Math.round(abs*10)/10)+' pts' : (Math.round(abs*10)/10)+' days';
  if (abs < (unit==='money'?100:0.05)) return 'flat vs prior period';
  return '<span class="trend '+(good?'down':'up')+'">'+(up?'▲':'▼')+' '+txt+'</span> vs prior period';
}
function whatChanged(m, prior){
  const out = []; const t = todayN();
  ACCOUNTS.forEach(a => { const s = acctStats(a.id);
    if (s.trend==='worse') out.push({ cls:'bad', t:esc(PARMAP[a.parent].name)+' · '+esc(a.name)+' is paying later', s:'Avg '+(Math.round(s.recent.avgLate*10)/10)+' days past terms on '+plural(s.recent.n,'invoice')+' in the last 60 days, vs '+(Math.round(s.prior.avgLate*10)/10)+' days on '+plural(s.prior.n,'invoice')+' in the 90 days before.', links:[{l:'Open the account',h:acctHash(a.id)},{l:'Overdue invoices',h:workHash('overdue',{a:a.id})}] });
    if (s.trend==='better') out.push({ cls:'good', t:esc(PARMAP[a.parent].name)+' · '+esc(a.name)+' is paying faster', s:'Avg '+(Math.round(s.recent.avgLate*10)/10)+' days past terms on '+plural(s.recent.n,'invoice')+' in the last 60 days, down from '+(Math.round(s.prior.avgLate*10)/10)+'.', links:[{l:'Open the account',h:acctHash(a.id)}] });
  });
  const missed = M.invoices.filter(i => i.promise && rel(i.promise.date) < t && balance(i)>0);
  if (missed.length) out.push({ cls:'bad', t:plural(missed.length,'promised payment')+' missed', s: missed.map(i=>PARMAP[i.parent].name+' on '+i.id+' ('+fmtD(i.promise.date)+')').join('; ')+'.', links:[{l:'See them',h:workHash('promise')}] });
  const held = m.held; if (held.length) out.push({ cls:'hold', t:money0(m.heldAmt)+' overdue is on hold, on purpose', s:'Reminders are paused on '+plural(held.length,'invoice')+' because a payment may already be in, a check is in the mail, a dispute is open, or a date was promised.', links:[{l:'What is held and why',h:workHash('held')}] });
  if (m.collected && prior.collected) out.push({ cls: m.collected>=prior.collected?'good':'warn', t:'Collected '+money0(m.collected)+' in the period', s:(m.collected>=prior.collected?'Up':'Down')+' from '+money0(prior.collected)+' in the period before, across '+plural(m.nPaid,'settled invoice')+'.', links:[{l:'Payments',h:hashFor({path:'activity',q:{k:'in'}})}] });
  return out.slice(0,5);
}

function workActions(w){

/* ---------- Insights ---------- */
function vInsights(q){
  const t = todayN(); const sortKey = q.s || 'late';
  const accts = ACCOUNTS.map(a=>acctStats(a.id));
  const rows = accts.filter(s=>s.recent.n>0).sort((x,y)=> sortKey==='ontime' ? (x.recent.onTime-y.recent.onTime) : sortKey==='overdue' ? (y.overdueAmt-x.overdueAmt) : (y.recent.avgLate-x.recent.avgLate));
  const worstAcct = accts.filter(s=>s.recent.n>0).sort((x,y)=>y.recent.avgLate-x.recent.avgLate)[0];
  const parents = PARENTS.map(p=>parentStats(p.id)).sort((x,y)=> y.overdueAmt-x.overdueAmt);
  const totalOverdue = sum(parents, p=>p.overdueAmt);

  const reasons = {}; M.invoices.filter(i=>balance(i)>0&&i.st.daysLate>0).forEach(i=>{ const r = reasonFor(i); if (r) { const o = reasons[r.code] = reasons[r.code]||{n:0,amt:0,text:r.text}; o.n++; o.amt += balance(i); } });

  </div>
  <div class="card section"><div class="section-h"><h2>Collected by week</h2><span class="small muted">Monday to Sunday weeks, labeled by their Monday. The dark bar is this week so far.</span></div>${weeklyChart(weeks)}</div>`;
}
function collectionsByWeek(n){
  const t = todayN(); const dow = (D(t).getDay()+6)%7;   // Monday = 0
  const thisMon = t - dow; const out = [];
  for (let k=n-1;k>=0;k--){ const from = thisMon - k*7, to = from + 6; let amt = 0, cnt = 0; M.bank.forEach(b => { const d = rel(b.date); if (d>=from && d<=to && d<=t && b.status==='matched') { amt += b.amount; cnt++; } }); out.push({ from: iso(D(from)), to: iso(D(Math.min(to,t))), amt, cnt, now: k===0 }); }
  return out;
}
function weeklyChart(weeks){
  const max = Math.max.apply(null, weeks.map(w=>w.amt)) || 1;
  return '<div class="cols">'+weeks.map((w,i)=>{ const h = Math.round(w.amt/max*100); const last = w.now; return '<div class="col" data-tip="Week of '+fmtD(w.from)+(last?' so far':'')+': '+money0(w.amt)+' in '+plural(w.cnt,'payment')+'"><div class="cv">'+(w.amt?money0(w.amt):'')+'</div><div class="ct"><div class="cf'+(last?' now':'')+'" style="height:'+Math.max(2,h)+'%"></div></div><div class="cl">'+(last?'This week':fmtD(w.from))+'</div></div>'; }).join('')+'</div>';
}

const TRAIN_EXAMPLES = ['Sign off with "Thanks, the team"', 'Never chase Fanwear Direct on a Friday', 'Always mention the PO number in a follow-up', 'Keep every message under four sentences'];
/* A sign-off rule is applied by the page itself, so it shows up in the next draft. */
function signoffFromRules(){ const rules = (STATE.train && STATE.train.rules) || []; for (const r of rules) { const m = r.match(/(?:sign\s*off|end(?:\s+(?:every|each|all))?\s+(?:message|draft|email)s?)\s*(?:with|as|:)?\s*["“]?([^"”]+?)["”]?\s*$/i); if (m && m[1]) return m[1].trim(); } return ''; }
function vTrain(){
  const T = STATE.train;
  return `<div class="head"><div><h1>Train</h1><div class="sub">Teach the desk how you think. Everything here rides along with every question you ask, and shapes the follow-up drafts. What you type stays in this browser and is used for nothing else.</div></div></div>

      <div class="row" style="margin-top:8px"><input type="text" id="tr-rule" placeholder="For example: never chase Fanwear Direct on a Friday" style="flex:1;min-width:220px"><button class="btn primary" data-train="add-rule">Add</button></div>

    </div>
  </div>
  <div class="card section"><h2>Paste something you wrote</h2>
    <div class="small muted" style="margin:4px 0 8px">An email to a buyer, a note to AP, anything in your own words. The desk learns the tone from it.</div>
    <textarea id="tr-sample" style="width:100%;min-height:110px;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical"></textarea>
    <div class="row between" style="margin-top:8px"><span class="small muted">${T.samples.length ? plural(T.samples.length,'sample')+' saved' : ''}</span><button class="btn primary" data-train="add-sample">Save</button></div>
    ${T.samples.length ? '<div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">'+T.samples.map((x,i)=>'<div class="ev" style="margin:0;display:flex;gap:10px;align-items:flex-start"><span style="flex:1">'+esc(x.length>160?x.slice(0,160)+'…':x)+'</span><button class="x-chip" data-train="remove-sample" data-i="'+i+'" aria-label="Remove">×</button></div>').join('')+'</div>' : ''}
  </div>`;

function wireTrain(){
  const T = STATE.train; const save = () => { saveState(); render(false); };
  app.querySelectorAll('[data-train]').forEach(el => el.addEventListener('click', () => {
    const k = el.getAttribute('data-train');
    if (k==='add-rule') { const v = app.querySelector('#tr-rule').value.trim(); if (!v) return; T.rules.push(v); toast(signoffFromRules() && /sign|end/i.test(v) ? 'Drafts now end with "'+signoffFromRules()+'".' : 'Rule added. It rides along with every question from now on.'); save(); }
    if (k==='example') { T.rules.push(el.textContent.trim()); toast('Example rule added.'); save(); }
    if (k==='remove-rule') { T.rules.splice(+el.getAttribute('data-i'),1); save(); }

/* =====================================================================
   ACTIONS — every button changes the events list, then the whole desk
   is rebuilt from it. Simulated only: no email, no bank.

function toast(text, link){ const box = document.getElementById('toasts'); const el = document.createElement('div'); el.className='toast'; el.innerHTML = '<span class="ok">✓</span><span>'+text+(link?' <a href="'+link.h+'">'+esc(link.l)+'</a>':'')+'</span>'; box.appendChild(el); setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 260); }, 4200); }
function busy(btn, fn){ if (!btn) return fn(); const w = btn.offsetWidth; btn.style.minWidth = w+'px'; const old = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true; setTimeout(()=>{ fn(); }, 380 + Math.random()*220); }
function findWork(id){ return M.work.items.find(w=>w.id===id); }
function modal(html){ const m = document.createElement('div'); m.className='modal'; m.innerHTML = '<div class="box" role="dialog" aria-modal="true">'+html+'</div>'; m.addEventListener('click', e => { if (e.target===m || e.target.closest('[data-close]')) m.remove(); }); document.body.appendChild(m); fixTails(m); const f = m.querySelector('input,textarea,button'); if (f) f.focus(); return m; }
function draftFor(scope){
  // scope: {inv} | {acct} | {parent}
  let invs = [], name = '', who = '';
  if (scope.inv) { const i = M.inv[scope.inv]; invs = [i]; name = PARMAP[i.parent].name; who = AMAP[i.acct].ap; }
  else if (scope.acct) { invs = M.invoices.filter(i=>i.acct===scope.acct && balance(i)>0 && i.st.daysLate>0); name = PARMAP[AMAP[scope.acct].parent].name; who = AMAP[scope.acct].ap; }
  else { invs = M.invoices.filter(i=>i.parent===scope.parent && balance(i)>0 && i.st.daysLate>0); name = PARMAP[scope.parent].name; who = PARMAP[scope.parent].name+' AP'; }
  invs.sort((x,y)=>y.st.daysLate-x.st.daysLate);
  const list = invs.map(i=>i.id+' · '+money(balance(i))+' · due '+fmtD(i.due)+(i.st.daysLate>0?' ('+i.st.daysLate+' days)':'')).join('\n');
  const total = sum(invs, balance);
  const signoff = signoffFromRules() || 'Thanks';
  const body = invs.length===0 ? 'Hi,\n\nQuick check-in on the account. Everything on our side shows current. Anything you need from us?\n\n'+signoff :
    invs.length===1 ? 'Hi,\n\nFollowing up on '+invs[0].id+' for '+money(balance(invs[0]))+', due '+fmtD(invs[0].due)+'. Could you let us know the remittance date, or flag anything missing on our side?\n\n'+signoff :
    'Hi,\n\nA quick note on '+plural(invs.length,'open invoice')+' totaling '+money(total)+':\n\n'+list+'\n\nCould you send the expected remit dates, or tell us if anything is missing so we can fix it today?\n\n'+signoff;
  return { to: who, subject: invs.length===1 ? invs[0].id+' · '+money(balance(invs[0])) : name+' · open invoices', body, invs };
}
function openDraft(scope, kind){

/* light markdown: paragraphs, **bold**, simple pipe tables, bullet lines */
function mdLite(s){
  const lines = String(s||'').trim().split('\n'); let out = '', inT = false, inL = false;
  const inline = x => esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  lines.forEach(l => { const t = l.trim();
    if (/^\|.*\|$/.test(t)) { if (/^\|[\s:-]+\|$/.test(t.replace(/\|/g,'|'))) return; const cells = t.slice(1,-1).split('|').map(c=>c.trim()); if (!inT) { out += '<table><tr>'+cells.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr>'; inT = true; } else out += '<tr>'+cells.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; return; }
    if (inT) { out += '</table>'; inT = false; }
    if (/^[-•*] /.test(t)) { if (!inL) { out += '<ul style="margin:4px 0;padding-left:18px">'; inL = true; } out += '<li>'+inline(t.slice(2))+'</li>'; return; }
    if (inL) { out += '</ul>'; inL = false; }
    if (t) out += '<p>'+inline(t)+'</p>';
  });
  if (inT) out += '</table>'; if (inL) out += '</ul>';
  return out;
}
function linkify(html){
  html = html.replace(/\bINV-(\d{5})\b/g, (m, n) => M.inv['INV-'+n] ? '<a href="'+invHash('INV-'+n)+'">INV-'+n+'</a>' : m);
  PARENTS.forEach(p => { const re = new RegExp('(^|[^\\w>/#-])('+p.name.replace(/[.*+?^${}()|[\]\\']/g,'\\$&')+')(?![^<]*>)', 'g'); html = html.replace(re, (m,a,b)=> a+'<a href="'+parentHash(p.id)+'">'+b+'</a>'); });
  return html;
}

function findEntities(q){
  const s = q.toLowerCase(); const out = { invs:[], parents:[], accts:[] };
  (q.match(/inv-?\s?\d{5}/gi)||[]).forEach(x => { const id = 'INV-'+x.replace(/\D/g,''); if (M.inv[id]) out.invs.push(id); });
  const pn = { fanwear:'fanwear', trailhead:'trailhead', 'stadium row':'stadiumrow', stadiumrow:'stadiumrow', cove:'cove', timberline:'timberline', arena:'arenaco', collective:'arenaco' };
  Object.keys(pn).forEach(k => { if (s.indexOf(k)!==-1 && out.parents.indexOf(pn[k])===-1) out.parents.push(pn[k]); });
  const an = { hoops:'fw-hoops', pitch:'fw-pitch', ring:'fw-ring', stadium:'fw-stadium', arena:null, 'ecom':null, 'stores':null };
  Object.keys(an).forEach(k => { if (s.indexOf(k)!==-1 && an[k]) out.accts.push(an[k]); });
  if (s.indexOf('arena')!==-1) out.accts.push(out.parents.indexOf('fanwear')!==-1 ? 'fw-stadium' : 'arenaco');
  if (s.indexOf('ecom')!==-1) out.accts.push(out.parents.indexOf('stadiumrow')!==-1 ? 'sr-ecom' : 'th-ecom');

    const T = STATE.train || {}; if (T.rules && T.rules.length) L.push('RULES FROM THE OWNER (follow these in every answer and draft): '+T.rules.map((r,i)=>(i+1)+'. '+r).join(' ')); if (T.samples && T.samples.length) L.push('HOW THE OWNER WRITES (match this tone in drafts): '+T.samples.join(' || ').slice(0,1500));
    L.push('SAMPLE DATA NOTE: every retailer, product, invoice, payment, contact, message and habit here is invented. Contacts are roles, never names. Never claim an email was sent: everything here is simulated.');
    let text = L.join('\n'); if (text.length > LIMIT) text = text.slice(0, LIMIT - 40) + '\n[snapshot trimmed for length]';
    return text;
  }
  function ask(question, local){
    if (typeof fetch !== 'function') return Promise.reject(new Error('no fetch'));
    if (paced()) { const e = new Error('paced'); e.paced = true; return Promise.reject(e); }
    const body = { demo, facts: facts(local), messages: askTurns.slice(-12).concat([{ role:'user', content: question }]) };
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null; const timer = ctrl && setTimeout(()=>ctrl.abort(), timeoutMs);
    sent.push(Date.now());
    if (timer) clearTimeout(timer);
    return Promise.reject(new Error('sample: no model calls'));
  }
  return { ask, facts };
})();

/* =====================================================================
   NO ORPHAN WORDS — measured against the box, never blind. Glues the
   tail of a block one word at a time and stops the moment the stub is
   gone, and never opens a gap on the line above. Bold phrases short
   enough to fit a line are kept whole.
   ===================================================================== */
function metricsOf(el){
  const cs = getComputedStyle(el); const cw = el.getBoundingClientRect().width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - parseFloat(cs.borderLeftWidth) - parseFloat(cs.borderRightWidth);
  if (!(cw > 0)) return null; const r = document.createRange(); r.selectNodeContents(el);
  const rects = [].filter.call(r.getClientRects(), x => x.width >= 1); if (!rects.length) return null;
  rects.sort((a,b)=>(a.top-b.top)||(a.left-b.left)); const rows = [];
  rects.forEach(x => { const c = rows[rows.length-1]; if (c && Math.abs(x.top-c.top) <= 10) { c.l = Math.min(c.l,x.left); c.rt = Math.max(c.rt,x.right); } else rows.push({ top:x.top, l:x.left, rt:x.right }); });
  const w = rows.map(o => (o.rt-o.l)/cw); return { n:w.length, last:w[w.length-1], minNon: w.length>1 ? Math.min.apply(null, w.slice(0,-1)) : 1 };
}
function fixTails(root){
  root = root || document; const NBSP = ' ';
  [].forEach.call(root.querySelectorAll('p,li,td,th,h1,h2,h3,.sub,.why,.s,.t,.reason,.small,.ttl,.msg,.stat .sub,.insight .s,.q,.timeline .b,.sched span,.kpi-row span,dd'), el => {
    if (el.querySelector('ul,ol,div,p,br,table')) return;
    let tn = null; for (let i = el.childNodes.length-1; i >= 0; i--) { const n = el.childNodes[i]; if (n.nodeType===3 && n.nodeValue.trim()) { tn = n; break; } if (n.nodeType===1) break; }
    if (!tn) return; const orig = tn.nodeValue.replace(/\s+$/,''); if (orig.indexOf(NBSP)!==-1) return; const words = orig.split(' '); if (words.length < 4) return;
    const m = metricsOf(el); if (!m || m.n < 2 || m.last >= 0.5) return; let best = null;
    for (let k = 1; k <= 4; k++) { if (words.length-k-1 < 1) break; tn.nodeValue = words.slice(0, words.length-k-1).join(' ')+' '+words.slice(words.length-k-1).join(NBSP); const mm = metricsOf(el); if (!mm || mm.n > m.n || mm.minNon < 0.85) break; best = tn.nodeValue; if (mm.last >= 0.5 || k >= 2) break; }
    tn.nodeValue = best || orig;
  });
  [].forEach.call(root.querySelectorAll('b,strong'), el => { if (el.children.length) return; const t = el.textContent; if (!t || t.indexOf(' ')===-1 || t.indexOf(NBSP)!==-1) return; const box = el.closest('p,div,li,td,span') || el.parentElement; if (!box) return; const cw = box.getBoundingClientRect().width; const r = document.createRange(); r.selectNodeContents(el); const rects = [].filter.call(r.getClientRects(), x=>x.width>=1); const tops = {}; rects.forEach(x=>{ tops[Math.round(x.top)] = 1; }); if (Object.keys(tops).length <= 1) return; const width = sum(rects, x=>x.width); if (width < cw - 12) el.textContent = t.replace(/ /g, NBSP); });
}
/* The scan the verification run reads: ?scan=1 walks every screen at the
   current width and writes the failures into #scanout. */
function stubNarrow(el){ const r = document.createRange(); r.selectNodeContents(el); const rs = [].filter.call(r.getClientRects(), x=>x.width>=1); if (rs.length < 2) return false; const widest = Math.max.apply(null, rs.slice(0,-1).map(x=>x.width)); return rs[rs.length-1].width < widest/2; }
function scanOrphans(){
  const bad = [];
  [].forEach.call(document.querySelectorAll('main *, .ask *'), el => {
    if (el.children.length) return; const node = el.firstChild; if (!node || node.nodeType!==3) return; const str = node.nodeValue.replace(/\s+$/,''); if (str.trim().split(/\s+/).length < 5) return;
    const lines = []; let lastTop = null, s = 0;
    for (let i = 0; i <= str.length; i++) { if (i===str.length || str[i]===' ') { if (i > s) { const r = document.createRange(); r.setStart(node,s); r.setEnd(node,i); const box = r.getClientRects()[0]; if (box && box.width) { const top = Math.round(box.top); if (lastTop===null || Math.abs(top-lastTop) > 4) { lines.push([]); lastTop = top; } lines[lines.length-1].push(str.slice(s,i)); } } s = i+1; } }
    if (lines.length > 1) { const tail = lines[lines.length-1].join(' '); if (tail.replace(/ /g,' ').trim().split(/\s+/).length <= 2 && tail.length < 20 && stubNarrow(el)) bad.push('"'+tail+'" ends: '+str.trim().slice(0,44)); }
  });
  const split = [].filter.call(document.querySelectorAll('b,strong'), el => { const tops = {}; [].forEach.call(el.getClientRects(), r => { if (r.width) tops[Math.round(r.top)] = 1; }); return Object.keys(tops).length > 1; }).map(el => el.textContent.slice(0,60));
  const over = [].filter.call(document.querySelectorAll('main *'), el => el.scrollWidth > el.clientWidth + 2 && ['auto','hidden'].indexOf(getComputedStyle(el).overflowX)===-1 && !el.closest('.tbl-wrap,.spark')).slice(0,10).map(el => el.tagName+'.'+el.className.split(' ')[0]+': '+(el.textContent||'').trim().slice(0,40));
  return { orphans: bad, splitBold: split, overflow: over };
}
