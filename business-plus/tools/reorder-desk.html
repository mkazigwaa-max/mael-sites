<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ece8e9">
<title>Harbor Goods · Reorder Desk</title>
<script>
/* A sample opened fresh (a link, a bookmark, a new tab) starts on its first
   screen; a refresh keeps the screen that was open. */
(function () { try { var n = performance.getEntriesByType('navigation')[0];
  if ((!n || n.type === 'navigate') && location.hash) history.replaceState(history.state, '', location.pathname + location.search);
} catch (e) { /* older browsers: keep the address as it is */ } })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#2f3c68; --red-deep:#130606; --red-wash:#d0d2da;
  --ink:#130606; --ink2:#5c5f6b; --mute:#726f77; --line:#d0d2da; --line2:#ece8e9;
  --tile:#ece8e9; --cream:#ece8e9; --white:#ece8e9;
  --low:#635032; --low-wash:#ece8e9; --ok:#2f3c68; --ok-wash:#ece8e9; --wait:#5c5f6b; --wait-wash:#ece8e9;
  --display:'Inter','Helvetica Neue',Arial,sans-serif;
  --sans:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);font:500 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
p,li,td,th,.why,.sub,.msg p{text-wrap:pretty}
.tile-name,.ins h3,.ins p{text-wrap:balance}
.why,.sub,.lede,.tile-name,.row-head .nm{text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}
.nowrap{white-space:nowrap}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{position:sticky;top:0;z-index:30;background:rgba(236,232,233,.94);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:0 28px;height:76px;display:flex;align-items:center;gap:36px}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;flex:none}
.logo svg{display:none}
.logo .word{font-weight:800;font-size:20px;letter-spacing:.01em;color:var(--ink)}
.logo .app{font-weight:700;font-size:13px;color:var(--ink2);padding-left:14px;border-left:1px solid var(--line);line-height:1.2}
.tabs{display:flex;gap:6px}
.tab{position:relative;display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:15px;color:var(--ink);padding:10px 12px;border-radius:999px;transition:background .15s}
.tab:hover{background:var(--tile)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-15px;height:3px;background:var(--red);border-radius:3px}
.tab .badge{background:var(--red);color:#ece8e9;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.tab .badge.zero{background:var(--ok)}
.tab .short{display:none}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:6px 12px;white-space:nowrap;border:1px dashed #b79d7a;color:#635032;background:#ece8e9;cursor:help}
.ghost{border:1px solid var(--line);background:#ece8e9;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s}
.ghost:hover{background:var(--tile)}
.ghost:active{transform:scale(.96)}

main{max-width:1240px;margin:0 auto;padding:40px 28px 140px}

.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;padding-bottom:26px;border-bottom:2px solid var(--ink)}
.hero h1{font:400 clamp(44px,6vw,76px)/.92 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase}
.hero .lede{margin:12px 0 0;font-size:16px;color:var(--ink2);max-width:52ch}
.big{text-align:right}
.big .v{font:400 clamp(40px,5vw,64px)/.95 var(--display);letter-spacing:.01em}
.big .l{font-size:13px;font-weight:600;color:var(--ink2);margin-top:6px}
.strip{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.strip .stat{display:flex;align-items:baseline;gap:8px;background:var(--tile);border-radius:999px;padding:8px 16px;text-decoration:none;transition:background .15s}
.strip a.stat:hover{background:var(--line)}
.strip .val{font:400 22px/1 var(--display)}
.strip .val.red{color:var(--red)}
.strip .lbl{font-size:13px;font-weight:600;color:var(--ink2)}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:13px;color:var(--ink2);margin-bottom:18px;padding:6px 10px 6px 6px;border-radius:999px;transition:background .15s}
.back:hover{background:var(--tile);color:var(--ink)}
.back svg{width:16px;height:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:#ece8e9;color:var(--ink);border-radius:999px;padding:11px 20px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,color .15s,transform .12s var(--ease),box-shadow .15s}
.btn:hover{background:var(--tile)}
.btn:active{transform:scale(.96)}
.btn.red{background:var(--red);border-color:var(--red);color:#ece8e9;box-shadow:0 6px 16px -8px rgba(57,41,31,.7)}
.btn.red:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn.quiet{border-color:var(--line)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:16px;height:16px;flex:none}

.rows{margin-top:10px}
.row-acct{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:28px;padding:28px 0;border-bottom:1px solid var(--line);position:relative}
.row-acct.gone{animation:gone .45s var(--ease) forwards}
@keyframes gone{to{opacity:0;transform:translateX(24px)}}
.row-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row-head .nm{font:400 30px/1 var(--display);letter-spacing:.01em;text-transform:uppercase;text-decoration:none}
.row-head .nm:hover{color:var(--red)}
.prog{font-size:12.5px;font-weight:700;background:var(--tile);border-radius:999px;padding:4px 10px;color:var(--ink2)}
.flag{font-size:12px;font-weight:800;border-radius:6px;padding:4px 9px;white-space:nowrap}
.flag.out{background:var(--red);color:#ece8e9}
.flag.low{background:var(--low-wash);color:var(--low)}
.flag.follow{background:var(--wait-wash);color:var(--wait)}
.flag.wait{background:var(--wait-wash);color:var(--wait)}
.flag.paused{background:var(--tile);color:var(--ink2)}
.flag.ok{background:var(--ok-wash);color:var(--ok)}
.flag.po{background:var(--wait-wash);color:var(--wait)}
.why{font-size:16px;margin:10px 0 0;max-width:62ch}
.facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mute)}
.facts b{color:var(--ink);font-weight:700}
.shelf{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.side{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:10px;text-align:right}
.side .amt{font:400 44px/1 var(--display)}
.side .amt-l{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}

.tile{width:118px;flex:none;text-decoration:none;color:inherit;display:block}
.tile .ph{position:relative;aspect-ratio:1;background:var(--tile);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tile .ph img{width:86%;height:86%;object-fit:contain;mix-blend-mode:multiply;transition:transform .35s var(--ease)}
.tile:hover .ph img{transform:scale(1.06)}
.tile.out .ph img{opacity:.42;filter:grayscale(.6)}
.tile .tag{position:absolute;left:8px;top:8px;font:400 13px/1 var(--display);letter-spacing:.04em;padding:4px 6px 3px;border-radius:4px;text-transform:uppercase}
.tile.out .tag{background:var(--red);color:#ece8e9}
.tile.low .tag{background:#ece8e9;color:var(--low);box-shadow:0 1px 0 var(--line)}
.meter{height:5px;border-radius:5px;background:var(--line);margin-top:8px;position:relative;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ok)}
.meter.low i{background:var(--low)} .meter.out i{background:var(--red)}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.tile-name{font-size:12px;font-weight:600;line-height:1.3;margin-top:7px;color:var(--ink);text-wrap:balance}
.tile-sub{font-size:12px;color:var(--mute);margin-top:2px}
.more-tile{width:118px;aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5px;font-weight:700;color:var(--ink2);text-decoration:none;padding:10px;transition:border-color .15s}
.more-tile:hover{border-color:var(--ink)}

.later{margin-top:44px;background:var(--cream);border-radius:16px;padding:22px 26px}
.later h2{font:400 26px/1 var(--display);text-transform:uppercase;margin:0 0 6px}
.later-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid #ece8e9}
.later-row:first-of-type{border-top:0}
.later-row .t{flex:1;min-width:0}
.later-row .t b{font-weight:800}
.later-row .t .sub{font-size:14px;color:var(--ink2);margin-top:2px}

.acct-hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:24px;border-bottom:2px solid var(--ink)}
.acct-hero h1{font:400 clamp(40px,5.4vw,68px)/.92 var(--display);text-transform:uppercase;margin:0;letter-spacing:.01em}
.acct-hero .row-head{margin-top:14px}
.acct-hero .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.grid-styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px 18px;margin-top:28px}
.sc{display:block;text-decoration:none;color:inherit}
.sc .ph{aspect-ratio:1;background:var(--tile);border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.sc .ph img{width:84%;height:84%;object-fit:contain;mix-blend-mode:multiply}
.sc.out .ph img{opacity:.42;filter:grayscale(.6)}
.sc .tag{position:absolute;left:10px;top:10px;font:400 15px/1 var(--display);letter-spacing:.04em;padding:5px 7px 4px;border-radius:4px;text-transform:uppercase}
.sc.out .tag{background:var(--red);color:#ece8e9} .sc.low .tag{background:#ece8e9;color:var(--low)} .sc.ok .tag{background:#ece8e9;color:var(--ok)}
.sc .qty{position:absolute;right:10px;bottom:10px;background:var(--ink);color:#ece8e9;font-weight:800;font-size:12.5px;border-radius:999px;padding:5px 10px}
.sc .nm{font-weight:700;font-size:14px;line-height:1.3;margin-top:10px}
.sc .kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-top:4px}
.sc .kv b{color:var(--ink)}
.sc .wks{font:400 22px/1 var(--display);margin-top:10px}
.sc .wks small{font:600 12px var(--sans);color:var(--mute);margin-left:4px}
.sc.out .wks,.sc.low .wks{color:var(--red)} .sc.low .wks{color:var(--low)}
.legend{display:flex;gap:18px;align-items:center;font-size:12.5px;color:var(--mute);margin-top:18px;flex-wrap:wrap}
.legend .meter{width:60px;margin:0}

.section{margin-top:48px}
.section h2{font:400 28px/1 var(--display);text-transform:uppercase;margin:0 0 14px}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12.5px;font-weight:700;color:var(--mute);text-align:left;padding:12px 12px;border-bottom:2px solid var(--ink);white-space:nowrap}
.tbl td{padding:16px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.click{cursor:pointer;transition:background .12s}
.tbl tr.click:hover td{background:#ece8e9}
.tbl .an{font:400 22px/1 var(--display);text-transform:uppercase}
.tbl .ap{font-size:12.5px;color:var(--mute);margin-top:3px}
.tbl .meter{width:120px;margin:0}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.day{margin-top:30px}
.day h3{font:400 22px/1 var(--display);text-transform:uppercase;margin:0 0 8px;color:var(--ink2)}
.act-row{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;transition:background .15s}
.act-row:hover{background:#ece8e9}
.act-row .ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.act-row .ic svg{width:18px;height:18px}
.act-row .ic.po{background:var(--ok-wash);color:var(--ok)} .act-row .ic.nudge{background:var(--wait-wash);color:var(--wait)}
.act-row .w{font-weight:800}
.act-row .d{font-size:13.5px;color:var(--ink2)}
.act-row.hl{background:var(--ok-wash);border-radius:12px;padding-left:10px;padding-right:10px;animation:hl 1.6s var(--ease)}
@keyframes hl{0%{box-shadow:0 0 0 0 rgba(47,60,104,.35)}100%{box-shadow:0 0 0 14px rgba(47,60,104,0)}}
.just{font-size:11.5px;font-weight:800;background:var(--ok);color:#ece8e9;border-radius:999px;padding:3px 9px;white-space:nowrap}

.rules{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}
.panel{border:1px solid var(--line);border-radius:16px;padding:8px 24px}
.panel h2{font:400 24px/1 var(--display);text-transform:uppercase;margin:18px 0 6px}
.rule{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.rule:last-child{border-bottom:0}
.rule>span:first-child{flex:1 1 200px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rule b{font-weight:700;text-wrap:balance}
.rule .hint{font-size:12.5px;color:var(--mute)}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#ece8e9}
.step button{width:38px;height:38px;border:0;background:none;font-size:18px;font-weight:700;cursor:pointer;transition:background .12s}
.step button:hover{background:var(--tile)}
.step button:active{background:var(--line)}
.step input{width:66px;height:38px;border:0;text-align:center;font:400 22px/1 var(--display);background:none;-moz-appearance:textfield;padding:0}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step input:focus{outline:none;background:var(--tile)}
.bump{animation:bump .22s var(--ease)}
@keyframes bump{50%{transform:scale(1.18)}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#ece8e9;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#ece8e9}
.chip:active{transform:scale(.95)}

.modal{position:fixed;inset:0;z-index:80;background:rgba(20,20,22,.36);animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.modal .box{position:absolute;top:0;right:0;height:100%;width:min(520px,100vw);background:#ece8e9;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.18);animation:slidein .32s var(--ease)}
@keyframes slidein{from{transform:translateX(100%)}}
.modal.closing{animation:fadeout .22s forwards} .modal.closing .box{animation:slideout .22s var(--ease) forwards}
@keyframes fadeout{to{opacity:0}} @keyframes slideout{to{transform:translateX(100%)}}
.d-head{display:flex;align-items:flex-start;gap:12px;padding:22px 24px 16px;border-bottom:1px solid var(--line)}
.d-head h2{font:400 32px/1 var(--display);text-transform:uppercase;margin:0}
.d-head .sub{font-size:13px;color:var(--ink2);margin-top:6px}
.x{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:var(--tile);cursor:pointer;font-size:20px;line-height:1;flex:none;transition:background .15s}
.x:hover{background:var(--line)}
.d-body{flex:1;overflow-y:auto;padding:6px 24px 20px;overscroll-behavior:contain}
.li{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line2)}
.li .ph{width:64px;height:64px;background:var(--tile);border-radius:8px;display:flex;align-items:center;justify-content:center}
.li .ph img{width:86%;height:86%;object-fit:contain;mix-blend-mode:multiply}
.li .n{font-weight:700;font-size:13.5px;line-height:1.3}
.li .s{font-size:12.5px;color:var(--mute);margin-top:3px}
.li .s.out{color:var(--red);font-weight:700}
.li .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.li .step button{width:30px;height:30px;font-size:16px}
.li .step input{width:44px;height:30px;font-size:18px}
.li .lt{font-size:12.5px;font-weight:700;color:var(--ink2)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 6px}
.tot .l{font-weight:700}
.tot .v{font:400 34px/1 var(--display)}
.email{background:var(--cream);border-radius:12px;padding:14px 16px;margin-top:14px}
.email label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:0 0 6px}
.email input,.email textarea{width:100%;font:500 14px/1.55 var(--sans);color:var(--ink);border:1px solid #ece8e9;background:#ece8e9;border-radius:8px;padding:10px 12px}
.email textarea{min-height:200px;resize:vertical;margin-top:10px}
.email .stale{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--low);font-weight:600}
.d-foot{border-top:1px solid var(--line);padding:16px 24px;display:flex;gap:10px;flex-wrap:wrap;background:#ece8e9}
.d-foot .btn.red{flex:1 1 180px}
.d-note{font-size:12px;color:var(--mute);padding:0 24px 14px;background:#ece8e9}

.toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#ece8e9;padding:12px 16px;border-radius:14px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 14px 34px rgba(0,0,0,.25);animation:toastin .3s var(--ease);pointer-events:auto}
.toast a{color:#ece8e9;font-weight:800}
.toast .ok{width:22px;height:22px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
.toast .ok svg{width:13px;height:13px}
.toast .ok path{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .35s .12s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.toast.out{animation:toastout .25s forwards}
@keyframes toastin{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes toastout{to{opacity:0;transform:translateY(8px)}}

.ask-fab{position:fixed;right:26px;bottom:26px;z-index:50;display:flex;align-items:center;gap:10px;background:var(--red);color:#ece8e9;border:0;border-radius:999px;padding:14px 20px 14px 16px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 12px 28px -10px rgba(57,41,31,.8);transition:transform .15s var(--ease),background .15s}
.ask-fab:hover{background:var(--red-deep);transform:translateY(-2px)}
.ask-fab:active{transform:scale(.95)}
.ask-fab svg{width:20px;height:20px}
.ask{position:fixed;top:0;right:0;height:100dvh;width:min(440px,100vw);background:#ece8e9;z-index:55;box-shadow:-20px 0 60px rgba(0,0,0,.16);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .3s var(--ease)}
.ask.open{transform:none}
.ask-h{display:flex;align-items:center;gap:10px;padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.ask-h h2{font:400 28px/1 var(--display);text-transform:uppercase;margin:0}
.ask-h .x{margin-left:auto}
.ask-b{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.msg{max-width:92%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5;animation:toastin .25s var(--ease)}
.msg.me{align-self:flex-end;background:var(--ink);color:#ece8e9;border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;background:var(--tile);border-bottom-left-radius:5px}
.msg.bot p{margin:0 0 6px} .msg.bot p:last-child{margin:0}

/* A shelf of shirts stays on one line; anything that would wrap hides behind
   "Show N more". Measured on the real width, so phones collapse sooner. */
const OPEN_SHELVES = new Set();
function fitShelves(){
  document.querySelectorAll('.shelf[data-shelf]').forEach(sh => {
    const id = sh.getAttribute('data-shelf'), btn = sh.querySelector('.more-btn');
    sh.classList.remove('collapsed'); btn.hidden = true;
    const items = [...sh.children].filter(x => x !== btn);
    items.forEach(x => x.classList.remove('over'));
    if (!items.length) return;
    const top = items[0].offsetTop;
    const over = items.filter(x => x.offsetTop > top + 4);
    if (!over.length) return;
    over.forEach(x => x.classList.add('over'));
    btn.hidden = false;
    if (!OPEN_SHELVES.has(id)) {
      sh.classList.add('collapsed');
      // the button needs a slot on the first line: give it the last visible tile's place if it wrapped
      if (btn.offsetTop > top + 4) { const vis = items.filter(x => !x.classList.contains('over')); const last = vis[vis.length-1]; if (last) last.classList.add('over'); }
    }
    const n2 = items.filter(x => x.classList.contains('over') && x.classList.contains('tile')).length;
    btn.textContent = OPEN_SHELVES.has(id) ? 'Show less' : 'Show '+n2+' more'; btn.setAttribute('aria-expanded', OPEN_SHELVES.has(id));
    btn.onclick = () => { if (OPEN_SHELVES.has(id)) OPEN_SHELVES.delete(id); else OPEN_SHELVES.add(id); buzz(5); fitShelves(); };
  });
}

function draftModel(){

    const m = metricsOf(el); if (!m || m.n < 2 || m.last >= 0.5) return; let best = null;
    for (let k = 1; k <= 4; k++) { if (words.length-k-1 < 1) break; tn.nodeValue = words.slice(0, words.length-k-1).join(' ')+' '+words.slice(words.length-k-1).join(NBSP); const mm = metricsOf(el); if (!mm || mm.n > m.n || mm.minNon < 0.85) break; best = tn.nodeValue; if (mm.last >= 0.5 || k >= 2) break; }
    tn.nodeValue = best || orig;
  });
  [].forEach.call(root.querySelectorAll('b,strong'), el => { if (el.children.length) return; const t = el.textContent; if (!t || t.indexOf(' ')===-1 || t.indexOf(NBSP)!==-1) return; const box = el.closest('p,div,li,td,span') || el.parentElement; if (!box) return; const cw = box.getBoundingClientRect().width; const r = document.createRange(); r.selectNodeContents(el); const rects = [].filter.call(r.getClientRects(), x=>x.width>=1); const tops = {}; rects.forEach(x=>{ tops[Math.round(x.top)] = 1; }); if (Object.keys(tops).length <= 1) return; const width = sum(rects, x=>x.width); if (width < cw - 12) el.textContent = t.replace(/ /g, NBSP); });
}

/* ?scan=1 walks every screen at the current width and writes failures into #scanout. */
function stubNarrow(el){ const r = document.createRange(); r.selectNodeContents(el); const rs = [].filter.call(r.getClientRects(), x=>x.width>=1); if (rs.length < 2) return false; const widest = Math.max.apply(null, rs.slice(0,-1).map(x=>x.width)); return rs[rs.length-1].width < widest/2; }
function scanOrphans(){
  const bad = [];
  [].forEach.call(document.querySelectorAll('main *, .modal *, .ask *'), el => {
    if (el.children.length) return; const node = el.firstChild; if (!node || node.nodeType!==3) return; const str = node.nodeValue.replace(/\s+$/,''); if (str.trim().split(/\s+/).length < 5) return;
    const lines = []; let lastTop = null, s = 0;
    for (let i = 0; i <= str.length; i++) { if (i===str.length || str[i]===' ') { if (i > s) { const r = document.createRange(); r.setStart(node,s); r.setEnd(node,i); const box = r.getClientRects()[0]; if (box && box.width) { const top = Math.round(box.top); if (lastTop===null || Math.abs(top-lastTop) > 4) { lines.push([]); lastTop = top; } lines[lines.length-1].push(str.slice(s,i)); } } s = i+1; } }
    if (lines.length > 1) { const tail = lines[lines.length-1].join(' '); if (tail.replace(/ /g,' ').trim().split(/\s+/).length <= 2 && tail.length < 20 && stubNarrow(el)) bad.push('"'+tail+'" ends: '+str.trim().slice(0,44)); }
  });
  const split = [].filter.call(document.querySelectorAll('b,strong'), el => { const tops = {}; [].forEach.call(el.getClientRects(), r => { if (r.width) tops[Math.round(r.top)] = 1; }); return Object.keys(tops).length > 1; }).map(el => el.textContent.slice(0,60));
  const over = [].filter.call(document.querySelectorAll('main *'), el => el.scrollWidth > el.clientWidth + 2 && ['auto','hidden'].indexOf(getComputedStyle(el).overflowX)===-1 && !el.closest('.tbl-wrap,.spark')).slice(0,10).map(el => el.tagName+'.'+el.className.split(' ')[0]+': '+(el.textContent||'').trim().slice(0,40));
  return { orphans: bad, splitBold: split, overflow: over };
}

/* ---------- boot ---------- */
if (!location.hash || location.hash === '#') history.replaceState(null, '', '#/chase');
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fixTails(document.getElementById('app')));
/* re-fit line endings when the WIDTH changes; a phone keyboard only changes the height, and redrawing then would close it */
let rsz, lastW = innerWidth; window.addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rsz); rsz = setTimeout(() => { if (!document.activeElement || !document.activeElement.matches('input,textarea')) render(); }, 150); });
if (/[?&]scan=1/.test(location.search)) {
  (async function(){
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const wait = ms => new Promise(res=>setTimeout(res,ms));
    const out = {};
    NO_SAVE = true; const hisRules = JSON.parse(JSON.stringify(STATE.rules));
    STATE.rules.own = [{ text:'Never chase Meadow Mart', read: readOwnRule('Never chase Meadow Mart') }, { text:'Remind me to call Robin before the home opener', read: readOwnRule('Remind me to call Robin before the home opener') }];
    for (const r of ['#/chase','#/styles','#/styles/'+(BASE['cfanchors'][0].h),'#/styles/'+(STYLES.find(s=>s.cb==='Endless Tour').h),'#/accounts','#/accounts/cfanchors','#/accounts/trailhead-gridiron','#/accounts/meadow','#/won','#/rules']) { history.replaceState(null,'',r); render(); await wait(120); out[r] = scanOrphans(); }
    SQ = 'cutie pop club'; history.replaceState(null,'','#/styles'); render(); await wait(120); out['search'] = scanOrphans(); SQ = '';
    STATE.rules.own = [];
    history.replaceState(null,'','#/chase'); render(); openDraft('cfanchors'); await wait(420); out['draft'] = scanOrphans(); document.querySelectorAll('.modal').forEach(x=>x.remove()); openDraft('trailhead-gridiron'); await wait(420); out['draft2'] = scanOrphans();
    document.querySelectorAll('.modal').forEach(x=>x.remove()); openThread('T1'); await wait(420); out['thread'] = scanOrphans();
    document.querySelectorAll('.modal').forEach(x=>x.remove()); askOpen(); for (const q of ASK_EXAMPLES.slice(0,5).concat(['fanwear','zzz'])) { const a = answer(q.toLowerCase()); addMsg('me', esc(q)); addMsg('bot', a.html); } await wait(120); out['ask'] = scanOrphans();
    STATE.rules = hisRules; NO_SAVE = false;
    document.getElementById('scanout').textContent = 'scanout '+JSON.stringify(out);
  })();
}
